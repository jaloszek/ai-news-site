<!doctype html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
{% seo %}
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📰</text></svg>">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a class="site-brand" href="{{ '/' | relative_url }}">
          <span class="site-brand-mark">📰</span> AI&nbsp;News&nbsp;Daily
        </a>
        <nav class="site-nav">
          <a href="{{ '/' | relative_url }}">Archive</a>
          <a href="{{ '/stats.html' | relative_url }}">Stats</a>
          <a href="{{ '/sources.html' | relative_url }}">Sources</a>
          <a href="{{ '/state-of-ai.html' | relative_url }}">State&nbsp;of&nbsp;AI</a>
          <a href="{{ '/feed.xml' | relative_url }}" title="Subscribe via RSS">RSS</a>
        </nav>
      </div>
    </header>

    <main class="page">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>{{ site.description }} · <a href="{{ '/feed.xml' | relative_url }}">RSS</a> · <a href="{{ '/slides/how-it-works/' | relative_url }}">How it works</a></p>
    </footer>

    <script src="{{ '/assets/js/harness-icons.js' | relative_url }}" data-root="{{ '/' | relative_url }}" defer></script>
  </body>
</html>
